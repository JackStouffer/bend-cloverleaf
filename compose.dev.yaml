# Keeps the same nginx and TLS path, but serves the frontend from Vite with hot reload.
services:
  web:
    develop:
      watch:
        - path: backend
          action: rebuild
          ignore:
            - build/

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  nginx:
    volumes:
      - certs:/etc/nginx/certs
      - ./deploy/nginx/frontend.vite.conf:/etc/nginx/cloverleaf/frontend.conf:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  frontend_node_modules:
