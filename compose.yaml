name: cloverleaf

# Each service has a hard memory cap, and swap can't stretch it. Bend has no heap
# limit, so a cap is what stands between a sizing mistake and the whole machine.
# The stack has to fit in 8GB.
services:
  web:
    image: cloverleaf-web
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    init: true
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - appraisals:/data
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/health HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      PUBLIC_HTTPS_PORT: "8443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy

  # Batch lookups, one state per run, against the road data in the image:
  #   docker compose run --rm road matrix /road/texas points.bin out.bin 36000 0
  # A run gets its own process because Bend's heap never shrinks. Local runs copy
  # the cached data/road into the image. A deployed image leaves ROAD_DATA at its
  # default, which rebuilds the data from scratch.
  road:
    image: cloverleaf-road
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: road
      args:
        ROAD_DATA: local
    profiles:
      - road
    init: true
    # Runs as the host user, so that jobs can write their results to ./data/jobs.
    user: "${UID:-1000}:${GID:-1000}"
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - ./data/jobs:/jobs

  # The nightly national solve, one process per run, reading each state's
  # instance and road matrix from ./data/jobs:
  #   docker compose --profile solver run --rm solver national /jobs/synth planner 36000 4 <state>...
  # scripts/nightly.mjs builds the matrices and passes the states.
  solver:
    image: cloverleaf-solver
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: solver
    profiles:
      - solver
    init: true
    user: "${UID:-1000}:${GID:-1000}"
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - ./data/jobs:/jobs

  # Refreshes the cached road data in ./data/road that local images copy. It only
  # runs when asked: docker compose run --rm road-build
  road-build:
    build:
      context: scripts
    profiles:
      - road-build
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - ./data:/data

volumes:
  appraisals:
  certs:
