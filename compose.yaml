name: cloverleaf

# Each service has a hard memory cap, and swap can't stretch it. Bend has no heap
# limit, so a cap is what stands between a sizing mistake and the whole machine.
# The stack has to fit in 8GB.
services:
  web:
    image: cloverleaf-backend
    build:
      context: backend
    init: true
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/health HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      PUBLIC_HTTPS_PORT: "8443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy

  # Batch lookups, one state per run: docker compose run --rm road matrix ...
  # A run gets its own process because Bend's heap never shrinks.
  road:
    image: cloverleaf-backend
    build:
      context: backend
    profiles:
      - road
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    entrypoint: [road, +RTS, --threads, "6", -RTS]
    volumes:
      - ./data:/data

  # Fetches the US extract and builds the state road records in ./data. It only
  # runs when asked: docker compose run --rm road-build
  road-build:
    build:
      context: scripts
    profiles:
      - road-build
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - ./data:/data

volumes:
  certs:
